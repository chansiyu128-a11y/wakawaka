<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WakaWaka 报价系统 — Cloud v15 (Snapshot 2026-05-03)</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f2f4f8;--card:#fff;--bd:#dfe3ec;--bdL:#eef0f5;--pri:#2d5be3;--priL:#e8eeff;--tx:#151929;--sc:#555d7a;--mu:#9aa1b9;--gn:#12a466;--gnB:#e6f9f0;--rd:#d93645;--rdB:#fdeef0;--am:#cf8a00;--amB:#fef6e0;--pu:#7446d6;--puB:#f1ecfd;--cy:#0882a1;--cyB:#e5f6fb;--radius:12px}
*{box-sizing:border-box;margin:0;padding:0}body{font-family:'DM Sans',system-ui,sans-serif;background:var(--bg);color:var(--tx);min-height:100vh;font-size:14px;line-height:1.5}button,input,select,textarea{font-family:inherit}
.hdr{background:var(--card);border-bottom:1px solid var(--bd);padding:12px 22px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;box-shadow:0 1px 6px rgba(45,91,227,.06)}
.logo{display:flex;align-items:center;gap:11px}.li{width:40px;height:40px;border-radius:10px;background:linear-gradient(135deg,#2d5be3,#7446d6);display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:800;color:#fff;box-shadow:0 3px 10px rgba(45,91,227,.3)}
.nav{display:flex;gap:2px;background:var(--bg);border-radius:10px;padding:3px;flex-wrap:wrap}.nav button{padding:7px 15px;border-radius:8px;border:none;cursor:pointer;font-size:12.5px;font-weight:500;background:transparent;color:var(--sc);white-space:nowrap}.nav button.on{background:var(--pri);color:#fff;font-weight:600}
.mn{padding:18px 22px;max-width:1500px;margin:0 auto}
.cd{background:var(--card);border:1px solid var(--bd);border-radius:var(--radius);padding:18px;margin-bottom:14px;box-shadow:0 1px 4px rgba(0,0,0,.04)}
.st{font-size:17px;font-weight:700;margin-bottom:14px}.ct{font-size:14px;font-weight:700;margin-bottom:12px}
table{width:100%;border-collapse:separate;border-spacing:0}th{padding:9px 10px;text-align:left;font-weight:600;color:var(--sc);border-bottom:2px solid var(--bd);font-size:11px;text-transform:uppercase;letter-spacing:.4px;white-space:nowrap;background:#fafafd}td{padding:7px 10px;border-bottom:1px solid var(--bdL);font-size:13px;white-space:nowrap}
.ip{padding:7px 10px;border-radius:8px;border:1.5px solid var(--bd);background:#fafbfe;color:var(--tx);font-size:13px;outline:none;width:100%;box-sizing:border-box}.ip:focus{border-color:var(--pri)}.ig{border-color:#a7f3d0;background:#f0fdf8}.iy{border-color:#fde68a;background:#fffdf5}
.ta{padding:7px 10px;border-radius:8px;border:1.5px solid var(--bd);background:#fafbfe;color:var(--tx);font-size:13px;outline:none;width:100%;box-sizing:border-box;resize:vertical;min-height:34px;font-family:inherit}.ta:focus{border-color:var(--pri)}
.sl{padding:8px 12px;border-radius:8px;border:1.5px solid var(--bd);background:#fff;color:var(--tx);font-size:13px;cursor:pointer;outline:none}
.bt{padding:8px 18px;border-radius:8px;border:none;font-weight:600;font-size:13px;cursor:pointer}.bp{background:var(--pri);color:#fff;box-shadow:0 2px 8px rgba(45,91,227,.25)}.bg{background:transparent;border:1.5px dashed var(--bd);color:var(--sc)}.bd{background:var(--rd);color:#fff}.bs{padding:5px 12px;font-size:12px}
.pl{padding:6px 14px;border-radius:8px;border:1.5px solid var(--bd);cursor:pointer;font-size:13px;font-weight:400;background:#fff;color:var(--sc)}.pl.on{border-color:var(--pri);background:var(--priL);color:var(--pri);font-weight:600}
.ba{display:inline-block;padding:2px 9px;border-radius:6px;font-size:11px;font-weight:600}
.lb{font-size:11px;color:var(--mu);margin-bottom:3px;font-weight:500}
.db{background:none;border:none;cursor:pointer;color:var(--rd);font-size:16px;padding:0;line-height:1;opacity:.6}.db:hover{opacity:1}
.sx{overflow-x:auto}.g{display:grid;gap:10px}.g2{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}.g3{grid-template-columns:repeat(auto-fill,minmax(280px,1fr))}.g4{grid-template-columns:repeat(auto-fit,minmax(140px,1fr))}.g5{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}.g6{grid-template-columns:repeat(auto-fill,minmax(300px,1fr))}
.sc{text-align:center;padding:14px}.sv{font-size:22px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.sl2{font-size:9px;color:var(--mu);text-transform:uppercase;letter-spacing:.6px;margin-top:3px}
.ch{position:relative;height:300px;width:100%}.chs{height:180px}
.hl{border:2px solid var(--pri);background:linear-gradient(135deg,#e8eeff,#f1ecfd)}
.ar{padding:14px;border-radius:10px;border:1.5px solid transparent}
.tc{display:none}.tc.on{display:block}
.rh{padding:14px 18px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;cursor:pointer}
.rb{padding:0 18px 18px;border-top:1px solid var(--bdL)}
.rs{font-size:13px;font-weight:700;color:var(--pri);margin:14px 0 10px}
.supabase-info{position:fixed;bottom:20px;left:20px;background:#fff;border:1.5px solid var(--bd);border-radius:12px;padding:14px 18px;box-shadow:0 4px 20px rgba(0,0,0,.10);z-index:900;max-width:340px;font-size:12px;color:var(--sc);display:none}
.supabase-info.show{display:block}
.supabase-info .sbi-title{font-weight:700;color:var(--tx);margin-bottom:8px;font-size:13px}
.supabase-info .sbi-row{display:flex;align-items:center;gap:6px;margin-bottom:6px}
.supabase-info .sbi-val{font-family:monospace;font-size:11px;background:#f2f4f8;padding:3px 8px;border-radius:5px;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.supabase-info .sbi-copy{background:var(--pri);color:#fff;border:none;border-radius:6px;padding:3px 10px;font-size:11px;cursor:pointer;flex-shrink:0}
.sync-bar{background:#fff;border-bottom:1px solid var(--bd);padding:7px 22px;display:flex;align-items:center;justify-content:space-between;font-size:12px;color:var(--sc);gap:10px;flex-wrap:wrap}
.sync-dot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:5px;flex-shrink:0}
.setup-ov{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:1000;display:flex;align-items:center;justify-content:center}
.setup-box{background:#fff;border-radius:16px;padding:32px;max-width:480px;width:90%;box-shadow:0 20px 60px rgba(0,0,0,.2)}
.toast{position:fixed;bottom:20px;right:20px;background:#12a466;color:#fff;padding:10px 20px;border-radius:10px;font-weight:600;font-size:13px;box-shadow:0 4px 16px rgba(0,0,0,.15);z-index:999;opacity:0;transition:opacity .3s;pointer-events:none}.toast.show{opacity:1}
@media(max-width:768px){.hdr{padding:10px 14px}.mn{padding:14px}.nav button{padding:6px 10px;font-size:11px}.g4,.g5{grid-template-columns:repeat(2,1fr)}}

/* === v3: Cost breakdown / Fee modal === */
.feeModalOv{position:fixed;inset:0;background:rgba(15,20,40,.55);z-index:1100;display:none;align-items:center;justify-content:center;padding:20px}
.feeModalOv.show{display:flex}
.feeModalBox{background:#fff;border-radius:14px;width:560px;max-width:100%;max-height:88vh;overflow:auto;box-shadow:0 20px 60px rgba(0,0,0,.25);padding:22px}
.feeModalBox .fmTitle{font-size:17px;font-weight:700;margin-bottom:4px}
.feeModalBox .fmSub{font-size:12px;color:var(--mu);margin-bottom:14px}
.feePresetGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-bottom:14px}
.feePresetGrid button{padding:9px 8px;border:1.5px solid var(--bd);border-radius:9px;background:#fafbfe;color:var(--tx);font-size:12px;font-weight:500;cursor:pointer;text-align:center;line-height:1.3;transition:all .15s}
.feePresetGrid button:hover{border-color:var(--pri);background:var(--priL);color:var(--pri)}
.feePresetGrid button.on{border-color:var(--pri);background:var(--pri);color:#fff;font-weight:600}
.feeDetailBox{background:#f7f9fd;border:1.5px solid var(--bdL);border-radius:10px;padding:14px;margin-bottom:12px}
.feeDetailBox .fdLabel{font-size:13px;font-weight:700;color:var(--pri);margin-bottom:5px}
.feeDetailBox .fdDesc{font-size:12px;color:var(--sc);line-height:1.55;margin-bottom:11px;background:#fff;border-radius:7px;padding:8px 10px;border-left:3px solid var(--pri)}
.feeRow{padding:9px 11px;background:#fff;border:1px solid var(--bdL);border-radius:8px;margin-bottom:6px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:12.5px}
.feeRow .fr-name{font-weight:600;color:var(--pu);min-width:120px}
.feeRow .fr-amt{font-weight:700;color:var(--gn)}
.feeRow .fr-desc{flex:1;font-size:12px;color:var(--sc)}
.cargoTog{display:inline-flex;background:#eef0f5;border-radius:9px;padding:3px;gap:0}
.cargoTog button{padding:6px 16px;border:none;background:transparent;border-radius:7px;cursor:pointer;font-size:12.5px;font-weight:600;color:var(--sc)}
.cargoTog button.on{background:var(--card);color:var(--pri);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.roundCard{border:1.5px solid var(--bdL);border-radius:11px;padding:14px;margin-bottom:11px;background:#fcfdff}
.roundCard .rcTotals{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--sc);margin-top:3px}
.roundCard .rcTotals b{color:var(--tx);font-weight:700}
.cgChip{display:inline-block;padding:2px 9px;border-radius:6px;font-size:11px;font-weight:600;background:var(--cyB);color:var(--cy)}
.cgChip.bulk{background:var(--amB);color:var(--am)}
.miniTable{width:100%;border-collapse:separate;border-spacing:0;font-size:12.5px}
.miniTable th{padding:6px 8px;text-align:left;font-size:10.5px;font-weight:600;color:var(--mu);text-transform:uppercase;letter-spacing:.4px;background:transparent;border-bottom:1px solid var(--bdL)}
.miniTable td{padding:5px 6px;border-bottom:1px dashed var(--bdL);vertical-align:middle}
.miniTable input.ip{padding:5px 8px;font-size:12px}
.feeBadge{display:inline-block;padding:1px 7px;border-radius:5px;font-size:10px;font-weight:600;background:var(--puB);color:var(--pu);margin-left:4px}

/* === v5: Bulk fee vertical stack === */
.bulkStack{display:flex;flex-direction:column;gap:8px;border:1px solid var(--bdL);border-radius:9px;padding:10px 12px;background:#fff;margin-bottom:10px}
.bulkRow{display:flex;align-items:flex-start;gap:12px;flex-wrap:wrap}
.bulkRow.bulkSubRow{padding-left:20px;border-left:2px dashed var(--bdL);margin-left:6px}
.bulkLabel{min-width:160px;font-weight:600;font-size:12.5px;color:var(--tx);padding-top:7px;line-height:1.3}
.bulkInputs{flex:1;display:flex;gap:6px;align-items:center;flex-wrap:wrap;min-width:0}
.bulkInputs .bulkDesc{flex:1;min-width:180px;font-size:12px}
@media(max-width:640px){.bulkLabel{min-width:auto;padding-top:0}.bulkInputs{width:100%}}

/* === v6: Unit×qty mini calc + HT suggestion line === */
.uqCalc{display:flex;align-items:center;gap:5px;flex-wrap:wrap;background:#f7f9fd;border:1px dashed var(--bdL);border-radius:7px;padding:5px 9px;font-size:11.5px}
.uqCalc .uqLab{color:var(--mu);font-weight:500;font-size:11px}
.uqCalc .uqX{color:var(--mu);font-weight:700;font-size:13px}
.uqCalc .uqIn{width:74px;padding:4px 7px;font-size:11.5px}
.uqCalc .uqEq{color:var(--gn);font-weight:700;font-size:11.5px;min-width:60px}
.uqCalc .uqApply{padding:3px 9px;font-size:10.5px}
.uqCalc.uqCalcSm{padding:4px 8px}
.suggLine{font-size:11px;color:var(--sc);background:#fef6e0;border-radius:6px;padding:4px 9px;display:inline-block;align-self:flex-start}

/* === v10: workflow section cards === */
.secCard{border-radius:12px;padding:14px 16px;margin-bottom:14px;background:#fff;border:1px solid var(--bdL);box-shadow:0 1px 2px rgba(0,0,0,.02)}
.secCard .secHd{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:700;margin-bottom:14px;padding-bottom:9px;border-bottom:1px solid var(--bdL)}
.secCard .secHd > span:first-of-type{color:var(--tx)}
.secCard .secHd .secSub{font-size:11px;color:var(--mu);font-weight:400;margin-left:4px}
.secCard.secInfo  {border-left:3px solid var(--pri); background:linear-gradient(180deg,#f7faff 0%,#fff 18%)}
.secCard.secCargo {border-left:3px solid var(--cy);  background:linear-gradient(180deg,#f3fbfd 0%,#fff 18%)}
.secCard.secQuote {border-left:3px solid var(--gn);  background:linear-gradient(180deg,#f3fbf7 0%,#fff 18%)}
.secCard.secFollow{border-left:3px solid var(--am);  background:linear-gradient(180deg,#fff9ec 0%,#fff 18%)}
.secCard .secHd > span:nth-child(2){color:var(--tx)}
.secCard.secInfo  .secHd > span:nth-child(2){color:var(--pri)}
.secCard.secCargo .secHd > span:nth-child(2){color:var(--cy)}
.secCard.secQuote .secHd > span:nth-child(2){color:var(--gn)}
.secCard.secFollow.secHd > span:nth-child(2){color:var(--am)}

/* === v11: Quote Overview collapsible sections === */
.ovSec{border:1px solid var(--bdL);border-radius:11px;margin-bottom:12px;background:#fff;overflow:hidden}
.ovSecHd{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 16px;cursor:pointer;background:linear-gradient(180deg,#f7faff 0%,#fff 100%);user-select:none;border-bottom:1px solid var(--bdL);font-size:14px}
.ovSecHd:hover{background:linear-gradient(180deg,#eef2fc 0%,#f7faff 100%)}
.ovSecHd .ovIco{font-size:15px}
.ovSecHd b{color:var(--tx);font-weight:700;font-size:14px}
.ovSecHd .ovSub{color:var(--sc);font-weight:500;font-size:13px;margin-left:2px}
.ovSecHd .ovMonth{color:var(--mu);font-weight:500;font-size:12px;margin-left:6px}
.ovSecHd .ovTri{color:var(--mu);font-size:12px;transition:transform .18s ease;flex-shrink:0}
.ovSecBody{padding:14px 16px}
.thHint{color:var(--mu);font-weight:400;font-size:9.5px;margin-left:2px}

/* === v13: country chip delete × === */
.pl.coChip{position:relative;padding-right:20px}
.pl.coChip .coDel{position:absolute;right:5px;top:50%;transform:translateY(-50%);font-size:11px;color:var(--mu);width:14px;height:14px;line-height:13px;text-align:center;border-radius:50%;display:none}
.pl.coChip:hover .coDel{display:inline-block}
.pl.coChip:hover .coDel:hover{background:var(--rdB);color:var(--rd)}
</style>
</head>

<div class="hdr"><div class="logo"><div class="li">W</div><div><div style="font-size:18px;font-weight:700;letter-spacing:-.3px">WakaWaka 报价系统</div><div style="font-size:10px;color:var(--mu)">Cross-Border Freight Quotation System</div></div></div><nav class="nav" id="nv"></nav></div>

<script>
const MS=[];for(let y=2024;y<=2027;y++)for(let m=1;m<=12;m++)MS.push(y+'-'+String(m).padStart(2,'0'));
const CS=[{id:'zambia',l:'🇿🇲 Zambia 赞比亚'},{id:'drc',l:'🇨🇩 DRC 刚果金'},{id:'malawi',l:'🇲🇼 Malawi 马拉维'}];
const TB=[{id:'quote',l:'📊 报价总览'},{id:'record',l:'📋 报价记录'},{id:'trend',l:'📈 趋势分析'},{id:'abnormal',l:'🚛 超限规则'},{id:'detention',l:'📦 滞箱费'},{id:'vehicle',l:'🚚 车辆规格'}];
const STS=[{v:'draft',l:'📝 Draft 草稿',c:'#9ca3af'},{v:'submitted',l:'📤 Submitted 已提交',c:'#3b82f6'},{v:'negotiating',l:'🤝 Negotiating 谈价中',c:'#f59e0b'},{v:'won',l:'✅ Won 成交',c:'#22c55e'},{v:'lost',l:'❌ Lost 未成交',c:'#ef4444'}];
const LR=['价格偏高','时效不满足','客户内部原因','竞对更低','货物取消','其他'];

/* compute totals from breakdown; return null if no breakdown filled */
function compTot(rec,rd){
  const num=v=>parseFloat(v)||0;
  // resolve amount: prefer .amount, fallback to unit*qty
  const _r=(o)=>{ if(!o)return 0; if(o.amount!==''&&o.amount!=null&&!isNaN(parseFloat(o.amount)))return num(o.amount); return num(o.unit)*num(o.qty); };
  let q=0,c=0,has=false;
  if(rec.cargoType==='container'){
    (rd.containers||[]).forEach(x=>{
      const a=num(x.amount), fc=num(x.fleetCost), qty=num(x.qty)||1;
      if(x.amount||x.fleetCost){has=true;q+=a*qty;c+=fc*qty;}
    });
  } else {
    const b=rd.bulk||{};
    [b.portFee,b.heavyLift].forEach(p=>{ if(!p)return; const v=_r(p); if(v>0||p.amount||p.unit||p.qty){has=true;q+=v;c+=v;} });
    if(b.freight){ const fv=_r(b.freight), fc=num(b.freight.fleetCost); if(fv>0||fc>0||b.freight.unit||b.freight.qty){has=true;q+=fv;c+=fc;} }
  }
  (rd.surcharges||[]).forEach(s=>{ const v=_r(s); if(v>0||s.amount||s.unit||s.qty){has=true;q+=v;c+=v;} });
  return has?{q:q,c:c,m:q-c}:null;
}

function mergeDeep(target,src){
  for(const k in src){
    if(src[k]&&typeof src[k]==='object'&&!Array.isArray(src[k])){
      if(!target[k])target[k]={};
      mergeDeep(target[k],src[k]);
    } else if(src[k]!==undefined&&src[k]!==null&&src[k]!==''){
      target[k]=src[k];

  }
}

const CFG_SK='waka_cfg_v1';
let dbUrl='',dbKey='',cloudMode=false;

function loadCfg(){
  try{
    const c=JSON.parse(localStorage.getItem(CFG_SK)||'{}');
    dbUrl=c.url||'';dbKey=c.key||'';cloudMode=!!(dbUrl&&dbKey);
  }catch(e){}
}

function doConnect(){
  const url=document.getElementById('cfgUrl').value.trim();
  const key=document.getElementById('cfgKey').value.trim();
  const err=document.getElementById('cfgErr');
  if(!url||!key){err.style.display='block';err.textContent='请填写完整的URL和Key';return;}
  localStorage.setItem(CFG_SK,JSON.stringify({url,key}));
  dbUrl=url;dbKey=key;cloudMode=true;
  document.getElementById('setupOv').style.display='none';
  setSyncBar('connecting');
  // Pull first to get latest data, then auto-sync local changes
  syncNow().then(()=>pullFromCloud());
}

function skipSetup(){
  cloudMode=false;
  document.getElementById('setupOv').style.display='none';
  setSyncBar('local');
}

function setSyncBar(s){
  const dot=document.getElementById('syncDot'),txt=document.getElementById('syncTxt');
  if(s==='ok'){dot.style.background='var(--gn)';txt.textContent='☁️ 云端已连接 — 数据多人共享';}
  else if(s==='syncing'){dot.style.background='var(--am)';txt.textContent='🔄 同步中...';}
  else if(s==='err'){dot.style.background='var(--rd)';txt.textContent='⚠️ 同步失败 — 使用本地缓存';}
  else if(s==='local'){dot.style.background='var(--mu)';txt.textContent='💾 本地模式 — 数据仅存此浏览器';}
  else if(s==='connecting'){dot.style.background='var(--am)';txt.textContent='🔌 连接中...';}
}

async function dbReq(table,method,body,extra){
  if(!cloudMode)return null;
  const base=dbUrl+'/rest/v1/'+table;
  const url=method==='GET'?(base+'?select=*'+(extra||'')):base;
  // Supabase upsert: POST with both resolution headers separated by comma
  const headers={'apikey':dbKey,'Authorization':'Bearer '+dbKey,'Content-Type':'application/json'};
  if(method==='POST'){
    headers['Prefer']='resolution=merge-duplicates';
  }
  const opts={method,headers};
  if(body)opts.body=JSON.stringify(body);
  const res=await fetch(url,opts);
  if(!res.ok){
    const errText=await res.text().catch(()=>'');
    throw new Error(res.status+' '+res.statusText+' '+errText);
  }
  if(method==='GET')return res.json();
  return true;
}

let syncTimer=null;
function autoSync(){clearTimeout(syncTimer);syncTimer=setTimeout(syncNow,3000);}

async function dbUpsert(table, rows){
  if(!rows||!rows.length)return;
  // Supabase upsert: POST + on_conflict query param + Prefer header
  const conflictCol={'prices':'country,destination,month','records':'id','settings':'key'}[table]||'id';
  const url=dbUrl+'/rest/v1/'+table+'?on_conflict='+conflictCol;
  const res=await fetch(url,{
    method:'POST',
    headers:{
      'apikey':dbKey,
      'Authorization':'Bearer '+dbKey,
      'Content-Type':'application/json',
      'Prefer':'resolution=merge-duplicates,return=minimal'
    },
    body:JSON.stringify(rows)
  });
  if(!res.ok){
    const txt=await res.text().catch(()=>'');
    throw new Error(table+' upsert '+res.status+': '+txt.slice(0,120));
  }
  return true;
}

async function syncNow(){
  if(!cloudMode){setSyncBar('local');return;}
  setSyncBar('syncing');
  try{
    // Only push user-modified prices (skip builtin historical data)
    const rows=[];
    for(const co in S.pr)for(const d in S.pr[co])for(const m in S.pr[co][d]){
      const p=S.pr[co][d][m];
      const bi=BUILTIN_PRICES?.[co]?.[d]?.[m];
      const changed=p.lowbed||p.quoteIssued||p.quoteSuggested||p.remarks||(p.flatbed&&(!bi||p.flatbed!==bi.flatbed));
      if(changed)rows.push({country:co,destination:d,month:m,flatbed:p.flatbed||null,lowbed:p.lowbed||null,quote_issued:p.quoteIssued||null,quote_suggested:p.quoteSuggested||null,remarks:p.remarks||null});
    }
    if(rows.length){
      for(let i=0;i<rows.length;i+=20)await dbUpsert('prices',rows.slice(i,i+20));
    }
    // Push records
    for(const r of S.recs)await dbUpsert('records',[{id:r.id,data:r}]);
    // Push settings
    await dbUpsert('settings',[{key:'destinations',value:S.ds},{key:'meta',value:{tg:S.tg,nt:S.nt,nid:S.nid}}]);
    setSyncBar('ok');
    showT('☁️ 已同步到云端');
  }catch(e){
    console.error('SyncNow error:',e);
    setSyncBar('err');
    showT('⚠️ 同步失败，详见Console');
  }
}

async function dbGet(table){
  const url=dbUrl+'/rest/v1/'+table+'?select=*';
  const res=await fetch(url,{
    method:'GET',
    headers:{'apikey':dbKey,'Authorization':'Bearer '+dbKey,'Content-Type':'application/json'}
  });
  if(!res.ok){const t=await res.text().catch(()=>'');throw new Error(table+' GET '+res.status+': '+t.slice(0,100));}
  return res.json();
}

async function pullFromCloud(){
  if(!cloudMode)return;
  setSyncBar('syncing');
  try{
    // Pull prices — merge cloud data on top of builtin
    const prices=await dbGet('prices');
    if(prices&&prices.length){
      prices.forEach(r=>{
        if(!r.country||!r.destination||!r.month)return;
        if(!S.pr[r.country])S.pr[r.country]={};
        if(!S.pr[r.country][r.destination])S.pr[r.country][r.destination]={};
        const cur=S.pr[r.country][r.destination][r.month]||{};
        if(r.flatbed)cur.flatbed=r.flatbed;
        if(r.lowbed)cur.lowbed=r.lowbed;
        if(r.quote_issued)cur.quoteIssued=r.quote_issued;
        if(r.quote_suggested)cur.quoteSuggested=r.quote_suggested;
        if(r.remarks)cur.remarks=r.remarks;
        S.pr[r.country][r.destination][r.month]=cur;
      });
    }
    // Pull records - merge: keep local records, add any cloud-only records
    const recs=await dbGet('records');
    if(recs&&recs.length){
      const localMap={};
      S.recs.forEach(r=>localMap[r.id]=r);
      // Add cloud records that don't exist locally
      recs.forEach(r=>{
        if(r.data&&r.data.id&&!localMap[r.data.id])localMap[r.data.id]=r.data;
      });
      S.recs=Object.values(localMap).sort((a,b)=>(a.cr<b.cr?1:-1));
    }
    // Pull settings
    const sets=await dbGet('settings');
    if(sets&&sets.length){
      sets.forEach(s=>{
        if(s.key==='destinations'&&s.value&&Object.keys(s.value).length)S.ds=s.value;
        if(s.key==='meta'&&s.value){
          if(s.value.tg!==undefined)S.tg=s.value.tg;
          if(s.value.nt!==undefined)S.nt=s.value.nt;
          if(s.value.nid&&s.value.nid>S.nid)S.nid=s.value.nid;
        }
      });
    }
    setSyncBar('ok');
    saveS();
    render();
    showT('☁️ 云端数据已加载');
  }catch(e){
    console.error('Pull error:',e);
    setSyncBar('err');
    render();
    showT('⚠️ 拉取失败: '+(e.message||'').slice(0,50));
  }
}

function detectCountryKey(rec){
  const dc=(rec.dc||'').toLowerCase().trim();
  if(/zambia|赞/.test(dc))return 'zambia';
  if(/drc|刚|congo/.test(dc))return 'drc';
  return null;
}
function genTerms(rec,rd){
  const cKey=detectCountryKey(rec); if(!cKey)return '';
  const ctype=rec.cargoType||'container';
  const tpl=TERMS_TEMPLATES[cKey+'-'+ctype]; if(!tpl)return '';
  let dt;
  if(rd && rd.d && /^\d{4}-\d{2}/.test(rd.d)) dt=new Date(rd.d+'T00:00:00');
  else dt=new Date();
  const month=dt.getMonth()+1, year=dt.getFullYear();
  const yy=String(year).slice(2);
  const lastDay=new Date(year,month,0).getDate();
  return tpl.replace(/\{MONTH\}/g,month).replace(/\{LASTDAY\}/g,lastDay).replace(/\{YY\}/g,yy).replace(/\{YEAR\}/g,year);
}


function genQuoteText(rec,rd){
  const lines=[];
  let header='';
  if(rec.cg)header+=String(rec.cg).trim();
  const podParts=[rec.dc,rec.dci].filter(Boolean).map(x=>String(x).trim());
  const polPart=(rec.port||'').trim();
  let routeLine='';
  if(polPart && podParts.length){ routeLine = polPart+' → '+podParts.join(' / '); }
  else if(polPart){ routeLine = polPart; }
  else if(podParts.length){ routeLine = podParts.join(' → '); }
  if(routeLine){ header += (header?'，':'')+'路线：'+routeLine; }
  if(header)lines.push(header);
  const md=(rd.d||'').match(/^(\d{4})-(\d{2})/);
  const monthLabel = md?(parseInt(md[2],10)+'月'):'';
  lines.push((monthLabel?monthLabel:'')+'份参考价格如下：');
  function fmtItem(name,unit,qty,amount,desc){
    const u=_qNum(unit), q=_qNum(qty), a=_qNum(amount);
    let s=name+'：USD';
    if(u>0&&q>0){
      const tot=u*q;
      s += _qFmt(u)+'*'+_qFmt(q)+'='+_qFmt(tot);
      if(a>0 && Math.abs(a-tot)>0.01) s += ' ('+_qFmt(a)+')';
    } else {
      s += _qFmt(a);
    }
    if(desc && String(desc).trim()) s += '（'+String(desc).trim()+'）';
    return s;
  }
  if(rec.cargoType==='container'){
    (rd.containers||[]).forEach(cn=>{
      const u=_qNum(cn.amount), q=_qNum(cn.qty)||1;
      if(!u && !q) return;
      let s=cn.size+'：USD'+_qFmt(u);
      if(q!==1) s += '*'+_qFmt(q)+'='+_qFmt(u*q);
      lines.push(s);
    });
  } else {
    const b=rd.bulk;
    function bulkLine(name,fee){
      const a=_qNum(fee.amount), u=_qNum(fee.unit), q=_qNum(fee.qty);
      if(!a && !u && !q) return;
      lines.push(fmtItem(name, fee.unit, fee.qty, fee.amount, fee.desc));
    }
    if(b){ bulkLine('港口费',  b.portFee); bulkLine('重吊费',  b.heavyLift); bulkLine('运费',    b.freight); }
  }
  (rd.surcharges||[]).forEach(sc=>{
    const a=_qNum(sc.amount), u=_qNum(sc.unit), q=_qNum(sc.qty);
    if(!a && !u && !q) return;
    lines.push(fmtItem(sc.label||'其他', sc.unit, sc.qty, sc.amount, sc.desc));
  });
  const tot=compTot(rec,rd);
  let totVal=tot?tot.q:_qNum(rd.q);
  lines.push('');
  lines.push('Total: USD'+_qFmt(totVal));
  const terms=genTerms(rec,rd);
  if(terms){ lines.push(''); lines.push('────── 报价条款 ──────'); lines.push(terms); }
  return lines.join('\n');
}

  '</div>'+
  (rec.cg?'<div class="cgInfo"><b style="color:#555">📦 货物信息：</b>'+esc(rec.cg)+'</div>':'')+

  ''+ /* 内部备注不导出到PDF */
  ((function(){const t=genTerms(rec,rd); return t?'<div class="terms"><div class="termsTitle">📑 报价条款 Terms &amp; Conditions</div><div class="termsBody">'+esc(t).replace(/\n/g,'<br>')+'</div></div>':'';})())+

  '</div>'+CT+HC;
  w.document.write(html); w.document.close();
  setTimeout(()=>{try{w.focus();}catch(e){}},200);

/* === v11: country flag + collapsible sections + return prices === */
// v13: country labels/flags/POL now derived dynamically from S.countries
const COUNTRY_FLAG  = new Proxy({}, {get:(t,k)=>{const x=(S.countries||[]).find(c=>c.id===k); return x?(x.flag||''):'';}});
const COUNTRY_LABEL = new Proxy({}, {get:(t,k)=>{const x=(S.countries||[]).find(c=>c.id===k); return x?(x.label||k):k;}});
const COUNTRY_POL   = new Proxy({}, {get:(t,k)=>{const x=(S.countries||[]).find(c=>c.id===k); return x?(x.pol||'DSM'):'DSM';}});

function gpRet(c,lp,m,f){return S.rt?.[c]?.[lp]?.[m]?.[f]??'';}
function spRet(c,lp,m,f,v){
  if(!S.rt[c])S.rt[c]={};
  if(!S.rt[c][lp])S.rt[c][lp]={};
  if(!S.rt[c][lp][m])S.rt[c][lp][m]={};
  S.rt[c][lp][m][f]=v; autoS();
}
function aRet(c){const i=document.getElementById('rdi-'+c); if(!i)return; const n=i.value.trim(); if(!n)return;
  if(!S.rds[c])S.rds[c]=[]; if(S.rds[c].includes(n)){showT('已存在该装货点');return;}
  S.rds[c].push(n); i.value=''; autoS(); rQ();
}
function dRet(c,i){S.rds[c].splice(i,1); autoS(); rQ();}

function togSec(key){S.ovColl[key]=!S.ovColl[key]; autoS();
  const body=document.getElementById('secB-'+key);
  const tri=document.getElementById('secT-'+key);
  if(body)body.style.display=S.ovColl[key]?'none':'';
  if(tri)tri.style.transform='rotate('+(S.ovColl[key]?-90:0)+'deg)';
}

/* v14: per-scope column configs */
const OV_COLS = {
  out: [
    {field:'flatbed',        label:'车队运价', cls:'',   bg:''},
    {field:'lowbed',         label:'低板运价', cls:'',   bg:''},
    {field:'quoteSuggested', label:'建议报价', cls:'iy', bg:'#fffbeb'},
  ],
  ret: [
    {field:'fleetPrice',  label:'车队意向价', cls:'',   bg:''},
    {field:'novaPrice',   label:'Nova报价',   cls:'ig', bg:'#ecfdf5'},
    {field:'marketPrice', label:'市场定价',   cls:'iy', bg:'#fffbeb'},
  ],
};

/* Helper: render one row for either outbound or return */
function ovRow(scope,c,m,d,i){
  const de=E(d).replace(/'/g,"\\'");
  const rd = scope==='out' ? (S.pr?.[c]?.[d]?.[m]||{}) : (S.rt?.[c]?.[d]?.[m]||{});
  const setExpr = scope==='out'
    ? "sp('"+de+"','"+m+"','{F}',this.value)"
    : "spRet('"+c+"','"+de+"','"+m+"','{F}',this.value)";
  const cols = OV_COLS[scope];
  function inp(field,cls){
    return '<input class="ip '+(cls||'')+'" style="width:108px" value="'+E(rd[field]||'')+'" placeholder="—" oninput="'+setExpr.replace('{F}',field)+'">';
  }
  function inpDesc(field){
    return '<input class="ip" style="width:100%;font-size:12px" value="'+E(rd[field]||'')+'" placeholder="说明 / 备注" oninput="'+setExpr.replace('{F}',field)+'">';
  }
  const delBtn = scope==='out'
    ? '<button class="db" onclick="S.ds[\''+c+'\'].splice('+i+',1);autoS();rQ()" title="删除">×</button>'
    : '<button class="db" onclick="dRet(\''+c+'\','+i+')" title="删除">×</button>';
  let row='<tr style="background:'+(i%2?'#fafafd':'#fff')+'"><td style="text-align:center">'+delBtn+'</td><td style="font-weight:600;white-space:nowrap">'+E(d)+'</td>';
  cols.forEach(col=>{ row += '<td>'+inp(col.field, col.cls)+'</td>'; });
  row += '<td style="min-width:240px">'+inpDesc('remarks')+'</td></tr>';
  return row;
}

/* Helper: render one collapsible section (out or ret) */
function ovSection(scope,c,m){
  const flag = COUNTRY_FLAG[c]||'', label = COUNTRY_LABEL[c]||c, pol = COUNTRY_POL[c]||'DSM';
  const subtitle = scope==='out' ? ('从 '+pol+' 出发') : ('从 '+(label.split(' ')[0])+' 回程');
  const key = c+'-'+scope;
  const collapsed = !!S.ovColl[key];
  const list = scope==='out' ? (S.ds[c]||[]) : (S.rds[c]||[]);
  const inputId = scope==='out' ? 'ndi-'+c : 'rdi-'+c;
  const addFn  = scope==='out' ? "S.ds['"+c+"'].push(document.getElementById('"+inputId+"').value.trim());document.getElementById('"+inputId+"').value='';autoS();rQ()" : "aRet('"+c+"')";
  const cols = OV_COLS[scope];
  let h='<div class="ovSec">';
  h+='<div class="ovSecHd" onclick="togSec(\''+key+'\')"><div><span class="ovIco">🗺️</span> <b>'+flag+' '+label+'</b> <span class="ovSub">— '+subtitle+'</span> <span class="ovMonth">('+m+')</span></div><span class="ovTri" id="secT-'+key+'" style="transform:rotate('+(collapsed?-90:0)+'deg)">▼</span></div>';
  h+='<div class="ovSecBody" id="secB-'+key+'" style="display:'+(collapsed?'none':'')+'">';
  h+='<div class="sx" style="max-height:520px"><table><thead><tr><th style="width:30px"></th><th>装货点</th>';
  cols.forEach(col=>{ h += '<th'+(col.bg?' style="background:'+col.bg+'"':'')+'>'+col.label+' <span class="thHint">(USD)</span></th>'; });
  h += '<th style="min-width:240px">说明</th></tr></thead><tbody>';
  if(list.length){ list.forEach((d,i)=>{ h+=ovRow(scope,c,m,d,i); }); }
  else { h+='<tr><td colspan="'+(cols.length+3)+'" style="text-align:center;color:var(--mu);padding:16px;font-size:12.5px">暂无装货点 — 在下方输入新装货点添加</td></tr>'; }
  h+='</tbody></table></div>';
  h+='<div style="display:flex;gap:8px;align-items:center;margin-top:10px;padding-top:10px;border-top:1px dashed var(--bdL)"><input id="'+inputId+'" class="ip" style="width:280px" placeholder="输入新装货点（如 Lusaka/Ndola/Kabwe/Kitwe/Chambishi）" onkeydown="if(event.key===\'Enter\'){'+addFn+'}"><button class="bt bg" onclick="'+addFn+'">＋ 添加装货点</button></div>';
  h+='</div></div>';
  return h;
}


/* === v13: Country management === */
function openAddCountry(){
  const ov=document.getElementById('countryModalOv');
  const box=document.getElementById('countryModalBody');
  if(!ov||!box)return;
  let h='<div style="font-size:17px;font-weight:700;margin-bottom:6px">＋ 添加国家</div>';
  h+='<div style="font-size:12px;color:var(--mu);margin-bottom:14px">填写后会出现在「报价总览 / 趋势分析」的国家选择栏</div>';
  h+='<div class="g g2" style="gap:10px"><div><div class="lb">国旗 emoji <span style="color:var(--mu);font-weight:400">(可选)</span></div><input id="cmFlag" class="ip" placeholder="🇹🇿" maxlength="4"></div>';
  h+='<div><div class="lb">起运港 POL</div><input id="cmPol" class="ip" placeholder="DSM / Tanga / 其他" value="DSM"></div></div>';
  h+='<div style="margin-top:10px"><div class="lb">显示名称</div><input id="cmLabel" class="ip" placeholder="如 Tanzania 坦桑尼亚 (含中英文方便辨识)"></div>';
  h+='<div style="margin-top:8px;font-size:11px;color:var(--mu)">💡 ID 会从显示名称自动生成（小写英文）</div>';
  h+='<div id="cmErr" style="color:var(--rd);font-size:12px;margin-top:8px;display:none"></div>';
  h+='<div style="display:flex;justify-content:flex-end;gap:8px;margin-top:14px"><button class="bt bg" onclick="closeAddCountry()">取消</button><button class="bt bp" onclick="confirmAddCountry()">✓ 添加</button></div>';
  box.innerHTML=h; ov.classList.add('show');
  setTimeout(()=>{const i=document.getElementById('cmLabel'); if(i)i.focus();},80);
}
function closeAddCountry(){const ov=document.getElementById('countryModalOv'); if(ov)ov.classList.remove('show');}
function confirmAddCountry(){
  const flag=(document.getElementById('cmFlag').value||'').trim();
  const pol =(document.getElementById('cmPol').value||'').trim()||'DSM';
  const label=(document.getElementById('cmLabel').value||'').trim();
  const err=document.getElementById('cmErr');
  function showErr(m){err.textContent=m;err.style.display='block';}
  if(!label){showErr('请填写显示名称');return;}
  // derive id from label: take first English word + lowercase
  const m=label.match(/[A-Za-z]+/);
  let id=(m?m[0]:'cust'+Date.now()).toLowerCase().slice(0,12);
  if(!id)id='cust'+Date.now();
  if(S.countries.find(c=>c.id===id)){showErr('已存在 ID="'+id+'"，请换个英文名');return;}
  S.countries.push({id:id,label:label,flag:flag,pol:pol});
  // init data slots
  if(!S.ds[id])S.ds[id]=[];
  if(!S.rds[id])S.rds[id]=[];
  if(!S.rt[id])S.rt[id]={};
  if(!S.pr[id])S.pr[id]={};
  autoS(); closeAddCountry(); showT('✅ 已添加：'+label); render();
}
function delCountry(id){
  if(S.countries.length<=1){showT('至少保留一个国家');return;}
  const co=S.countries.find(c=>c.id===id); if(!co)return;
  // Check if any data exists
  const dsLen=(S.ds[id]||[]).length;
  const rdsLen=(S.rds[id]||[]).length;
  const prLen=Object.keys(S.pr[id]||{}).length;
  const hasData=dsLen>0||rdsLen>0||prLen>0;
  const msg='确认删除「'+co.label+'」？'+(hasData?'\n\n⚠️ 该国家下有数据：去程目的地'+dsLen+'个，回程装货点'+rdsLen+'个，价格条目'+prLen+'条。删除后这些数据都会丢失。':'');
  if(!window.confirm(msg))return;
  S.countries=S.countries.filter(c=>c.id!==id);
  delete S.ds[id]; delete S.rds[id]; delete S.rt[id]; delete S.pr[id];
  if(S.co===id) S.co=S.countries[0].id;
  autoS(); render(); showT('已删除：'+co.label);
}

/* ═══ INIT ═══ */
loadCfg();
migAll();
// Auto-connect: if config is saved and has url+key, connect immediately
if(cloudMode){
  setSyncBar('connecting');

} else if(localStorage.getItem(CFG_SK)){
  // Config exists but incomplete
  setSyncBar('local');
} else {
  // First time - show setup
  document.getElementById('setupOv').style.display='flex';
  setSyncBar('local');
}

render();
</script>
